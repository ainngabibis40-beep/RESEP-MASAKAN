<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CemilanKu - Ide Masakan & Cemilan Ringan</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan font Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🍳 CemilanKu</h1>
            <p>Inspirasi Cemilan Ringan & Mudah Dibuat di Rumah</p>
        </div>
    </header>

    <main>
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Cari ide cemilan... (misal: pisang, tahu)">
        </section>

        <section class="recipe-grid" id="recipeGrid">
            <!-- Kartu resep akan dimuat di sini oleh JavaScript -->
        </section>
    </main>

    <!-- Modal (Pop-up) untuk Detail Resep -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Judul Resep</h2>
            <div class="modal-body">
                <div class="ingredients">
                    <h3>Bahan-bahan:</h3>
                    <ul id="modalIngredients"></ul>
                </div>
                <div class="instructions">
                    <h3>Cara Membuat:</h3>
                    <ol id="modalInstructions"></ol>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CemilanKu. Dibuat dengan ❤️ untuk pecinta ngemil.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
