<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DapurKreatif - Ide Masakan & Cemilan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="text-gray-800">
    <header class="bg-orange-500 text-white p-6 shadow-md text-center">
        <h1 class="text-4xl font-bold">🍳 DapurKreatif</h1>
        <p class="mt-2 text-orange-100 text-lg">Temukan Ide Masakan & Cemilan Ringan dengan Mudah!</p>
    </header>
    
    <main class="container mx-auto p-6 mt-6">
        <div class="mb-8 text-center">
            <h2 class="text-2xl font-semibold mb-4">Rekomendasi Hari Ini</h2>
            <button onclick="acakResep()" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-6 rounded-full shadow-lg transition duration-300">
                🎲 Acak Resep
            </button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="recipe-container">
            <!-- Recipe Cards will be generated here -->
        </div>
    </main>

    <script>
        const recipes = [
            { title: "Roti Panggang Keju Lumer", time: "10 Menit", desc: "Cemilan cepat dan lezat dengan lelehan keju mozzarella.", image: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=400&q=80" },
            { title: "Telur Gulung SD", time: "15 Menit", desc: "Jajanan nostalgia yang gurih dan mudah dibuat dengan saus sambal.", image: "https://images.unsplash.com/photo-1628205466827-0208cb21dc91?auto=format&fit=crop&w=400&q=80" },
            { title: "Pisang Goreng Crispy", time: "20 Menit", desc: "Pisang goreng renyah dengan taburan coklat dan keju parut.", image: "https://images.unsplash.com/photo-1596561162464-9686001d9f4f?auto=format&fit=crop&w=400&q=80" },
            { title: "Pancake Sederhana", time: "25 Menit", desc: "Pancake lembut dengan siraman madu dan mentega.", image: "https://images.unsplash.com/photo-1554520735-0a14524022a1?auto=format&fit=crop&w=400&q=80" },
            { title: "Omelet Sayur", time: "15 Menit", desc: "Sarapan sehat dan mengenyangkan dengan campuran sayuran segar.", image: "https://images.unsplash.com/photo-1510693208754-0466bba7899b?auto=format&fit=crop&w=400&q=80" },
            { title: "Jasuke (Jagung Susu Keju)", time: "10 Menit", desc: "Cemilan manis gurih jagung manis dengan keju dan susu kental manis.", image: "https://images.unsplash.com/photo-1605335198273-0430be08c7b8?auto=format&fit=crop&w=400&q=80" }
        ];

        const container = document.getElementById('recipe-container');
        
        function tampilkanResep(data) {
            container.innerHTML = '';
            data.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-lg overflow-hidden card border border-gray-100';
                card.innerHTML = `
                    <img src="${recipe.image}" alt="${recipe.title}" class="w-full h-52 object-cover">
                    <div class="p-5">
                        <h2 class="text-xl font-bold text-orange-600">${recipe.title}</h2>
                        <p class="text-sm text-gray-500 mt-2 font-medium">⏱️ Waktu: ${recipe.time}</p>
                        <p class="mt-3 text-gray-700 leading-relaxed">${recipe.desc}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function acakResep() {
            const shuffled = [...recipes].sort(() => 0.5 - Math.random());
            tampilkanResep(shuffled.slice(0, 3));
        }

        // Tampilkan semua saat pertama dimuat
        tampilkanResep(recipes);
    </script>
</body>
</html>
